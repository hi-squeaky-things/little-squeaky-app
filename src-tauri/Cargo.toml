[package]
name = "little_squeaky"
version = "0.2.0"
description = "little squeaky application"
authors = ["Daniël"]
edition = "2021"


[lib]
name = "lttl_squeaky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
little_weirdo = { version = "0.1.3" }
cpal = "0.17.1"
include_dir = "0.7"

